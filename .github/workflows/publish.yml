name: Publish to RubyGems

on:
  push:
    branches:
      - openapi
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: '3.3'

      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Build and publish if new version
        run: |
          VERSION=$(ruby -e "puts Gem::Specification.load('ultracart_api.gemspec').version")
          if curl -s https://rubygems.org/api/v1/versions/ultracart_api.json | grep -q "\"number\":\"$VERSION\""; then
            echo "ultracart_api $VERSION already published, skipping"
          else
            gem build ultracart_api.gemspec
            gem push ultracart_api-$VERSION.gem
          fi
